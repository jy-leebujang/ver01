# Created: 2026-10-18 19:32
# 상식 퀴즈 서버. 컨테이너 내부 3000번을 NAS의 8080번으로 열고, DB 파일은 NAS 폴더에 보관한다.
# 집 밖 접속은 이 포트를 직접 열지 않고, DSM 리버스 프록시(6001 → localhost:8080)로만 연결한다.
services:
  quiz:
    build: .
    container_name: quiz
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      PORT: "3000"
      DB_PATH: /data/quiz.db
    volumes:
      # 컨테이너를 지우고 다시 만들어도 quiz.db가 남는다. 폴더를 미리 만들어 둘 것.
      - /volume2/docker/quiz/data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
